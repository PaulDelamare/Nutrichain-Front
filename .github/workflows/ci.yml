name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Les tests unitaires de composants tournent en mode navigateur (vitest-browser-svelte)
      - run: npx playwright install --with-deps chromium
      # Avec couverture : le plancher de 70 % exigé par le livrable est configuré dans
      # `vite.config.ts` et échoue le job en dessous — sans job qui l'exerce, il ne garantit rien.
      - run: npm run test:coverage

      - name: Publier le taux de couverture
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Couverture non produite (les tests ont échoué avant)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const ligne = (nom, m) => \`| \${nom} | \${m.pct}% | \${m.covered}/\${m.total} |\`;
            const out = [
              '### Couverture de tests (plancher : 70 %)', '',
              '| Mesure | Taux | Couvert |', '|---|---|---|',
              ligne('Lignes', t.lines), ligne('Branches', t.branches),
              ligne('Fonctions', t.functions), ligne('Instructions', t.statements),
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            console.log(out);
          "

      - name: Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-front
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Le webServer de playwright.config.ts build et sert l'app sur 4173.
      # Sans API, seuls les smoke tests tournent (le parcours API est gated par E2E_API=1).
      - run: npm run test:e2e
